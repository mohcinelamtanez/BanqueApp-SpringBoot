spring.application.name=backend
# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/banqueApp
spring.datasource.username=root
spring.datasource.password=

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# FILE UPLOADS (Client profile photo)
# =========================
# Directory uploaded files are written to (LocalFileStorageService) and
# served back from ("/api/uploads/**", see WebConfig) — relative to the
# backend process's working directory.
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB